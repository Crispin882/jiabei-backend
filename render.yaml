services:
  - type: web
    name: jiabei-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_KEY
        sync: false
      - key: VISION_PROVIDER
        value: qwen
      - key: ASR_PROVIDER
        value: qwen
